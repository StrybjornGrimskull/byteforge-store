# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console for debugging
spring.h2.console.enabled=true

# Disable security for tests
spring.security.user.name=test
spring.security.user.password=test

# Mail configuration for tests
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.byteforge=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.mockito=WARN
logging.level.net.bytebuddy=WARN

# Disable Flyway for tests
spring.flyway.enabled=false

# SQL initialization is disabled by default in tests

# JWT properties for tests
jwt.secret=mySuperSecretKeyWithAtLeast512BitsLengthThisIsJustExampleKeyChangeItInProduction!
jwt.expiration=86400000

# Disable HTTPS for tests
server.ssl.enabled=false
server.port=8080

# Application properties
spring.application.name=ByteForgeOnlineStore