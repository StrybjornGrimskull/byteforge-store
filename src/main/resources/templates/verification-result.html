<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verification Result | ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Verification Result Styles -->
    <link rel="stylesheet" th:href="@{/css/verification-result.css}">
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="bi bi-cpu"></i> ByteForge
            </div>
            
            <!-- Success Result -->
            <div th:if="${verified}" class="result-icon success">
                <i class="bi bi-check-circle"></i>
            </div>
            
            <!-- Error Result -->
            <div th:unless="${verified}" class="result-icon error">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            
            <!-- Success Title and Message -->
            <div th:if="${verified}">
                <h2>Email Verified!</h2>
                <p class="message">
                    Your email has been successfully verified. You can now sign in to your account.
                </p>
            </div>
            
            <!-- Error Title and Message -->
            <div th:unless="${verified}">
                <h2>Verification Failed</h2>
                <p class="message" th:text="${error}">
                    An error occurred during email verification.
                </p>
            </div>

            <!-- Back to Sign In Button -->
            <a href="/auth/login" class="btn-secondary">
                <i class="bi bi-arrow-left me-2"></i>
                Back to Sign In
            </a>
        </div>
    </div>
</body>
</html>
