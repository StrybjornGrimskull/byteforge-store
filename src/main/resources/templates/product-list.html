<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalog | ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Product List Styles -->
    <link rel="stylesheet" th:href="@{/css/product-list.css}">
</head>
<body>
<!-- Navigation Fragment -->
<div th:replace="~{fragments/navigation :: navigation}"></div>

<!-- Main Content -->
<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="text-white">Home</a></li>
            <li class="breadcrumb-item"><a href="#" th:href="@{/}" class="text-white">Categories</a></li>
        </ol>
    </nav>
    <h1 class="mb-4">Product Catalog</h1>

    <!-- Форма поиска и фильтров -->
    <form id="filterForm" class="row g-3 mb-4 align-items-end" onsubmit="event.preventDefault(); loadProducts();">
        <div class="col-md-3">
            <label for="categoryId" class="form-label">Category</label>
            <select name="categoryId" id="categoryId" class="form-select" onchange="updateBrands();">
                <option value="">All Categories</option>
                <!-- Categories will be loaded dynamically via JavaScript -->
            </select>
        </div>
        <div class="col-md-4">
            <label for="name" class="form-label">Search</label>
            <input type="text" name="name" id="name" class="form-control" placeholder="Search by name...">
        </div>
        <div class="col-md-3">
            <label for="brandId" class="form-label">Brand</label>
            <select name="brandId" id="brandId" class="form-select">
                <option value="">All Brands</option>
                <!-- Brands will be loaded dynamically via JavaScript -->
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Price Range</label>
            <div class="d-flex">
                <input type="number" name="minPrice" id="minPrice" class="form-control me-2" placeholder="Min" min="0"
                       step="0.01">
                <input type="number" name="maxPrice" id="maxPrice" class="form-control" placeholder="Max" min="0"
                       step="0.01">
            </div>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">Apply Filters</button>
            <button type="button" class="btn btn-outline-light flex-grow-1" onclick="resetFilters()">Reset</button>
        </div>
    </form>

    <!-- Список товаров -->
    <div id="productList" class="product-list">
        <div class="col-12 text-center">Loading products...</div>
    </div>

    <!-- Кнопка "Load More" -->
    <div id="loadMoreContainer" class="text-center mt-4" style="display: none;">
        <button id="loadMoreBtn" class="btn btn-primary">Show next 12 products</button>
    </div>

    <!-- Кнопка "Back to top" -->
    <div id="backToTopContainer" class="text-center mt-4" style="display: none;">
        <button id="backToTopBtn" class="btn btn-outline-light" onclick="scrollToTop()">Back to top</button>
    </div>
</div>

<!-- Footer Fragment -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<!-- No external JS needed -->

<!-- Custom Product List Script -->
<script th:src="@{/js/product-list.js}"></script>

<!-- User Account Script -->
<div th:replace="~{fragments/navigation :: user-account-script}"></div>

</body>
</html>
