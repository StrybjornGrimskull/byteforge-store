<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resend Verification Email | ByteForge</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Resend Verification Styles -->
    <link rel="stylesheet" th:href="@{/css/resend-verification.css}">
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="bi bi-cpu"></i> ByteForge
            </div>
            
            <h2>Resend Verification</h2>
            <p class="subtitle">Enter your email to receive a new verification link</p>

            <div id="message-container" style="display: none;"></div>

            <form id="resendForm">
                <div class="form-field">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" 
                           class="form-input" 
                           id="email" 
                           name="email" 
                           placeholder="Enter your email" 
                           required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-send me-2"></i>
                    Resend Email
                </button>
            </form>

            <div class="auth-links">
                <a th:href="@{/auth/login}">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Resend Verification Script -->
    <script th:src="@{/js/resend-verification.js}"></script>
</body>
</html>
