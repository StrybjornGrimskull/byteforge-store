<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Reviews - ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Фоновое изображение для страницы */
        body {
            background-image: url('/uploads/icons/opoy7.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Ubuntu', sans-serif !important;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            color: white;
        }

        /* Белый текст для всех элементов */
        .product-description,
        .price-section,
        .stock-status,
        h1, h2, h3, h4, h5, h6,
        .card-title,
        .card-text,
        .no-reviews h3,
        .no-reviews p {
            color: white;
        }

        /* Стеклянные карточки отзывов */
        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .card-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .card-body {
            background: transparent;
        }

        .rating {
            color: #ffc107;
            font-size: 1.2rem;
        }

        /* Прозрачный хедер */
        .product-header {
            background: transparent;
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 0;
        }

        .product-header h1 {
            margin: 0;
            font-weight: 600;
            color: white;
        }

        .breadcrumb a {
            text-decoration: none !important;
        }

        .breadcrumb a:hover {
            text-decoration: none !important;
        }

        /* Стили для хлебных крошек */
        .breadcrumb-item + .breadcrumb-item::before {
            color: rgba(255, 255, 255, 0.7);
            content: "/";
        }

        .breadcrumb-item.active {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Стеклянная карточка для пустого состояния */
        .no-reviews {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
        }

        .no-reviews i {
            color: white !important;
        }

        .no-reviews h3 {
            color: white !important;
        }

        .no-reviews p {
            color: white !important;
        }

        /* Стили для текста отзывов */
        .card-text {
            color: white;
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.7) !important;
        }


    </style>
</head>
<body>
    <!-- Navigation -->
    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <!-- Product Header -->
    <header class="product-header">
        <div class="container">
            <!-- Breadcrumb navigation -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0" id="breadcrumb">
                    <li class="breadcrumb-item"><a href="/" class="text-white">Home</a></li>
                    <li class="breadcrumb-item" id="category-breadcrumb" style="display: none;">
                        <a href="#" class="text-white" id="category-link">Category</a>
                    </li>
                    <li class="breadcrumb-item" id="product-breadcrumb" style="display: none;">
                        <a href="#" class="text-white" id="product-link">Product</a>
                    </li>
                    <li class="breadcrumb-item active text-white-50" aria-current="page">Reviews</li>
                </ol>
            </nav>
            <h1 class="mb-0" id="page-title">Reviews</h1>
        </div>
    </header>

    <main class="container my-0">
        <!-- Hidden input for product ID -->
        <input type="hidden" id="product-id" th:value="${productId}">
        
        <!-- Reviews Section -->
        <section class="pt-4">
            <h2 class="h4 mb-3">All Reviews</h2>


            <!-- Reviews List -->
            <div id="no-reviews" class="no-reviews" style="display: none;">
                <i class="bi bi-chat-square-text display-4 text-muted mb-3"></i>
                <h3>No Reviews Yet</h3>
                <p class="text-muted">There are no reviews for this product yet.</p>
            </div>

            <div id="reviews-container" style="display: none;">
                <!-- Reviews will be loaded here via JavaScript -->
            </div>

            <!-- Error Message -->
            <div id="error-message" class="alert alert-danger" style="display: none;">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span id="error-text">Failed to load reviews. Please try again later.</span>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Product Reviews API Script -->
    <script>
        (function() {
            'use strict';
            
            // Get product ID from hidden input
            const productIdInput = document.getElementById('product-id');
            const productId = productIdInput ? productIdInput.value : null;
            
            if (!productId) {
                showError('Product ID not found');
                return;
            }

            // Load product and reviews data
            loadProductAndReviews();

            async function loadProductAndReviews() {
                try {
                    // Load product info and reviews in parallel
                    const [productResponse, reviewsResponse] = await Promise.all([
                        fetch(`/api/products/${productId}`),
                        fetch(`/api/reviews/product/${productId}`)
                    ]);

                    if (!productResponse.ok) {
                        throw new Error(`Failed to load product: ${productResponse.status}`);
                    }
                    if (!reviewsResponse.ok) {
                        throw new Error(`Failed to load reviews: ${reviewsResponse.status}`);
                    }

                    const product = await productResponse.json();
                    const reviews = await reviewsResponse.json();

                    // Update page content
                    updateProductInfo(product);
                    displayReviews(reviews);

                } catch {
                    showError('Failed to load product information and reviews');
                }
            }

            function updateProductInfo(product) {
                // Update page title
                document.getElementById('page-title').textContent = `Reviews for ${product.name}`;

                // Update breadcrumbs
                const categoryBreadcrumb = document.getElementById('category-breadcrumb');
                const productBreadcrumb = document.getElementById('product-breadcrumb');
                const categoryLink = document.getElementById('category-link');
                const productLink = document.getElementById('product-link');

                if (product.categoryId && product.categoryName) {
                    categoryLink.textContent = product.categoryName;
                    categoryLink.href = `/products/list?categoryId=${product.categoryId}`;
                    categoryBreadcrumb.style.display = 'block';
                }

                if (product.id && product.name) {
                    productLink.textContent = product.name;
                    productLink.href = `/products/details/${product.id}`;
                    productBreadcrumb.style.display = 'block';
                }
            }

            function displayReviews(reviews) {
                const noReviews = document.getElementById('no-reviews');
                const reviewsContainer = document.getElementById('reviews-container');

                if (!reviews || reviews.length === 0) {
                    noReviews.style.display = 'block';
                    return;
                }

                // Display reviews
                reviewsContainer.innerHTML = '';
                reviews.forEach(review => {
                    const reviewCard = createReviewCard(review);
                    reviewsContainer.appendChild(reviewCard);
                });
                reviewsContainer.style.display = 'block';
            }

            function createReviewCard(review) {
                const card = document.createElement('div');
                card.className = 'card mb-4';

                // Create stars HTML
                const starsHtml = Array.from({length: 5}, (_, i) => 
                    `<i class="bi ${i < review.rating ? 'bi-star-fill' : 'bi-star'}"></i>`
                ).join('');

                // Format date
                const date = new Date(review.createdAt);
                const formattedDate = date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });

                card.innerHTML = `
                    <div class="card-header">
                        <div class="d-flex align-items-center mb-2">
                            <h5 class="mb-0 me-2">${review.userFirstName || 'Anonymous User'}</h5>
                            <div class="rating" aria-label="Rating: ${review.rating} out of 5 stars">
                                ${starsHtml}
                                <span class="visually-hidden">${review.rating} out of 5 stars</span>
                            </div>
                        </div>
                        <small class="text-muted">${formattedDate}</small>
                    </div>
                    <div class="card-body">
                        <p class="card-text">${review.text}</p>
                    </div>
                `;

                return card;
            }

            function showError(message) {
                const errorMessage = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');

                errorText.textContent = message;
                errorMessage.style.display = 'block';
            }
        })();
    </script>

    <!-- User Account Script -->
    <div th:replace="~{fragments/navigation :: user-account-script}"></div>
</body>
</html>
