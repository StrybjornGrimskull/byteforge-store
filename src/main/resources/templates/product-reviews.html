<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Reviews - ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Product Reviews Styles -->
    <link rel="stylesheet" th:href="@{/css/product-reviews.css}">
</head>
<body>
    <!-- Navigation -->
    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <!-- Product Header -->
    <header class="product-header">
        <div class="container">
            <!-- Breadcrumb navigation -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0" id="breadcrumb">
                    <li class="breadcrumb-item"><a href="/" class="text-white">Home</a></li>
                    <li class="breadcrumb-item" id="category-breadcrumb" style="display: none;">
                        <a href="#" class="text-white" id="category-link">Category</a>
                    </li>
                    <li class="breadcrumb-item" id="product-breadcrumb" style="display: none;">
                        <a href="#" class="text-white" id="product-link">Product</a>
                    </li>
                    <li class="breadcrumb-item active text-white-50" aria-current="page">Reviews</li>
                </ol>
            </nav>
            <h1 class="mb-0" id="page-title">Reviews</h1>
        </div>
    </header>

    <main class="container my-0">
        <!-- Hidden input for product ID -->
        <input type="hidden" id="product-id" th:value="${productId}">
        
        <!-- Reviews Section -->
        <section class="pt-4">
            <h2 class="h4 mb-3">All Reviews</h2>


            <!-- Reviews List -->
            <div id="no-reviews" class="no-reviews" style="display: none;">
                <i class="bi bi-chat-square-text display-4 text-muted mb-3"></i>
                <h3>No Reviews Yet</h3>
                <p class="text-muted">There are no reviews for this product yet.</p>
            </div>

            <div id="reviews-container" style="display: none;">
                <!-- Reviews will be loaded here via JavaScript -->
            </div>

            <!-- Error Message -->
            <div id="error-message" class="alert alert-danger" style="display: none;">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span id="error-text">Failed to load reviews. Please try again later.</span>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Product Reviews Script -->
    <script th:src="@{/js/product-reviews.js}"></script>

    <!-- User Account Script -->
    <div th:replace="~{fragments/navigation :: user-account-script}"></div>
</body>
</html>
