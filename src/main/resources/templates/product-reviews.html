<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Reviews - ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}"/>
    <style>
        /* Фоновое изображение для страницы */
        body {
            background-image: url('/uploads/icons/opoy7.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Ubuntu', sans-serif !important;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            color: white;
        }

        /* Белый текст для всех элементов */
        .product-description,
        .price-section,
        .stock-status,
        h1, h2, h3, h4, h5, h6,
        .card-title,
        .card-text,
        .no-reviews h3,
        .no-reviews p {
            color: white;
        }

        /* Стеклянные карточки отзывов */
        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .card-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .card-body {
            background: transparent;
        }

        .rating {
            color: #ffc107;
            font-size: 1.2rem;
        }

        /* Прозрачный хедер */
        .product-header {
            background: transparent;
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 0;
        }

        .product-header h1 {
            margin: 0;
            font-weight: 600;
            color: white;
        }

        .breadcrumb a {
            text-decoration: none !important;
        }

        .breadcrumb a:hover {
            text-decoration: none !important;
        }

        /* Стили для хлебных крошек */
        .breadcrumb-item + .breadcrumb-item::before {
            color: rgba(255, 255, 255, 0.7);
            content: "/";
        }

        .breadcrumb-item.active {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Стеклянная карточка для пустого состояния */
        .no-reviews {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
        }

        .no-reviews i {
            color: white !important;
        }

        .no-reviews h3 {
            color: white !important;
        }

        .no-reviews p {
            color: white !important;
        }

        /* Стили для текста отзывов */
        .card-text {
            color: white;
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.7) !important;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div th:replace="fragments/navigation :: navigation"></div>

    <!-- Product Header -->
    <header class="product-header">
        <div class="container">
            <!-- Breadcrumb navigation -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-white">Home</a></li>
                    <li class="breadcrumb-item" th:if="${product?.category != null}">
                        <a th:href="@{/products/list(categoryId=${product.category.id})}" class="text-white"
                           th:text="${product.category.name}">Category</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/products/details/{id}(id=${product.id})}" class="text-white"
                           th:text="${product.name}">Product</a>
                    </li>
                    <li class="breadcrumb-item active text-white-50" aria-current="page">Reviews</li>
                </ol>
            </nav>
            <h1 class="mb-0">Reviews for <span th:text="${product.name}"></span></h1>
        </div>
    </header>

    <main class="container my-0">
        <!-- Reviews Section -->
        <section class="pt-4">
            <h2 class="h4 mb-3">All Reviews</h2>

            <!-- Reviews List -->
            <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
                <i class="bi bi-chat-square-text display-4 text-muted mb-3"></i>
                <h3>No Reviews Yet</h3>
                <p class="text-muted">There are no reviews for this product yet.</p>
            </div>

            <div class="row" th:if="${!#lists.isEmpty(reviews)}">
                <div class="col-md-6 col-lg-4 mb-4" th:each="review : ${reviews}">
                    <div class="card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-0" th:text="${review.userFirstName} ?: 'Anonymous User'">Anonymous User</h5>
                                <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'MMM d, yyyy')}"></small>
                            </div>
                            <div class="rating" aria-label="Rating: ${review.rating} out of 5 stars">
                                <span th:each="i : ${#numbers.sequence(1, 5)}" aria-hidden="true">
                                    <i th:class="${i <= review.rating ? 'bi bi-star-fill' : 'bi bi-star'}"></i>
                                </span>
                                <span class="visually-hidden">${review.rating} out of 5 stars</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="card-text" th:text="${review.text}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- User Account Script -->
    <div th:replace="fragments/navigation :: user-account-script"></div>
</body>
</html>
