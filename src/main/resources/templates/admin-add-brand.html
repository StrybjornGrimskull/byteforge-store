<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Brand - ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .form-section {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .section-header {
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .btn-submit {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #0b5ed7 0%, #0a58ca 100%);
            transform: translateY(-1px);
        }
        .breadcrumb {
            background: transparent;
            padding: 0;
        }
        .breadcrumb-item a {
            color: #0d6efd;
            text-decoration: none;
        }
        .breadcrumb-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navigation Fragment -->
<div th:replace="fragments/navigation :: navigation"></div>

<div class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Admin Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/admin/dashboard/products">Products Management</a></li>
            <li class="breadcrumb-item active" aria-current="page">Add New Brand</li>
        </ol>
    </nav>

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-5 fw-bold">Add New Brand</h1>
        <div class="text-muted">
            <i class="bi bi-person-check me-1"></i>
            <span sec:authentication="name">Admin</span>
        </div>
    </div>

    <!-- Add Brand Form Section -->
    <div class="form-section">
        <div class="section-header">
            <h2 class="h3 fw-bold text-primary">
                <i class="bi bi-tag me-2"></i>
                Brand Information
            </h2>
            <p class="text-muted mb-0">Fill in the details to create a new brand</p>
        </div>
        
        <form id="brandForm" class="needs-validation" novalidate>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="brandName" class="form-label fw-semibold">Brand Name *</label>
                        <input type="text" class="form-control" id="brandName" name="brandName" 
                               placeholder="Enter brand name" required>
                        <div class="invalid-feedback">
                            Please provide a valid brand name.
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="brandLogo" class="form-label fw-semibold">Brand Logo *</label>
                        <input type="file" class="form-control" id="brandLogo" name="brandLogo" 
                               accept=".webp" required>
                        <div class="invalid-feedback">
                            Please select a logo file.
                        </div>
                        <div class="form-text">Upload brand logo (WebP format only)</div>
                    </div>
                </div>
            </div>
            
            <div class="d-flex justify-content-between">
                <a href="/admin/dashboard/products" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Products Management
                </a>
                <button type="submit" class="btn btn-primary btn-submit">
                    <i class="bi bi-plus-circle me-1"></i>
                    Create Brand
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer Fragment -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Form Validation and API Script -->
<script>
    // Form validation and API submission
    (function() {
        'use strict';
        
        const brandForm = document.getElementById('brandForm');
        if (brandForm) {
            brandForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                if (!brandForm.checkValidity()) {
                    event.stopPropagation();
                    brandForm.classList.add('was-validated');
                    return;
                }
                
                brandForm.classList.add('was-validated');
                
                // Show loading state
                const submitBtn = brandForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>Creating...';
                submitBtn.disabled = true;
                
                try {
                    // Prepare form data
                    const formData = new FormData();
                    formData.append('name', document.getElementById('brandName').value);
                    
                    const logoFile = document.getElementById('brandLogo').files[0];
                    formData.append('logo', logoFile);
                    
                    // Send API request
                    const response = await fetch('/api/brands', {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });
                    
                    if (response.ok) {
                        // Show success message
                        showAlert('success', 'Brand created successfully!');
                        // Reset form
                        brandForm.reset();
                        brandForm.classList.remove('was-validated');
                    } else {
                        // Get error message from server
                        let errorMessage = 'Failed to create brand';
                        try {
                            const errorText = await response.text();
                            if (errorText) {
                                errorMessage = errorText;
                            }
                        } catch (e) {
                            console.error('Error reading error message:', e);
                        }
                        showAlert('error', errorMessage);
                    }
                    
                } catch (error) {
                    console.error('Error creating brand:', error);
                    showAlert('error', 'Failed to create brand. Please try again.');
                } finally {
                    // Restore button state
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            });
        }
        
        function showAlert(type, message) {
            // Remove existing alerts
            const existingAlerts = document.querySelectorAll('.alert');
            existingAlerts.forEach(alert => alert.remove());
            
            // Create new alert
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show`;
            alertDiv.setAttribute('role', 'alert');
            
            const icon = type === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
            alertDiv.innerHTML = `
                <i class="bi ${icon} me-2"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            // Insert after page header
            const pageHeader = document.querySelector('.d-flex.justify-content-between.align-items-center.mb-4');
            pageHeader.parentNode.insertBefore(alertDiv, pageHeader.nextSibling);
            
            // Auto-dismiss success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.remove();
                    }
                }, 5000);
            }
        }
    })();
</script>

<!-- User Account Script -->
<div th:replace="fragments/navigation :: user-account-script"></div>

</body>
</html>
