<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Brand - ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom Admin Add Brand Styles -->
    <link rel="stylesheet" th:href="@{/css/admin-add-brand.css}">
</head>
<body class="bg-light">

<!-- Navigation Fragment -->
<div th:replace="fragments/navigation :: navigation"></div>

<div class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Admin Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/admin/dashboard/products">Products Management</a></li>
            <li class="breadcrumb-item active" aria-current="page">Add New Brand</li>
        </ol>
    </nav>

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-5 fw-bold">Add New Brand</h1>
        <div class="text-muted">
            <i class="bi bi-person-check me-1"></i>
            <span sec:authentication="name">Admin</span>
        </div>
    </div>

    <!-- Add Brand Form Section -->
    <div class="form-section">
        <div class="section-header">
            <h2 class="h3 fw-bold text-primary">
                <i class="bi bi-tag me-2"></i>
                Brand Information
            </h2>
            <p class="text-muted mb-0">Fill in the details to create a new brand</p>
        </div>
        
        <form id="brandForm" class="needs-validation" novalidate>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="brandName" class="form-label fw-semibold">Brand Name *</label>
                        <input type="text" class="form-control" id="brandName" name="brandName" 
                               placeholder="Enter brand name" required>
                        <div class="invalid-feedback">
                            Please provide a valid brand name.
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="brandLogo" class="form-label fw-semibold">Brand Logo *</label>
                        <input type="file" class="form-control" id="brandLogo" name="brandLogo" 
                               accept=".webp" required>
                        <div class="invalid-feedback">
                            Please select a logo file.
                        </div>
                        <div class="form-text">Upload brand logo (WebP format only)</div>
                    </div>
                </div>
            </div>
            
            <div class="d-flex justify-content-between">
                <a href="/admin/dashboard/products" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Products Management
                </a>
                <button type="submit" class="btn btn-primary btn-submit">
                    <i class="bi bi-plus-circle me-1"></i>
                    Create Brand
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer Fragment -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Form Validation and API Script -->
<!-- Custom Admin Add Brand Script -->
<script th:src="@{/js/admin-add-brand.js}"></script>

<!-- User Account Script -->
<div th:replace="fragments/navigation :: user-account-script"></div>

</body>
</html>
