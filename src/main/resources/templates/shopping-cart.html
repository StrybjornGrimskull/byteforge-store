<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Shopping Cart | ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Фоновое изображение для страницы */
        body {
            background-image: url('/uploads/icons/opoy7.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Ubuntu', sans-serif !important;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            color: white;
        }

        /* Белый текст для всех элементов */
        .product-description,
        .price-section,
        .stock-status,
        .cart-item h5,
        .cart-item p,
        .summary-card h5,
        .summary-card span,
        .delivery-option h6,
        .delivery-option p {
            color: white;
        }

        /* Стеклянные карточки корзины */
        .cart-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            position: relative;
        }

        .product-img-container {
            height: 120px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .product-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: brightness(1.1) contrast(1.1);
        }

        /* Стеклянная карточка сводки */
        .summary-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        /* Кнопка оформления заказа */
        .btn-checkout {
            background-color: rgba(255, 255, 255, 0.9) !important;
            color: #333 !important;
            border: 2px solid rgba(255, 255, 255, 0.5) !important;
            font-weight: 500;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none !important;
            display: block !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            z-index: 10 !important;
            position: relative !important;
        }

        .btn-checkout:disabled,
        .btn-checkout.disabled {
            background-color: rgba(255, 255, 255, 0.3) !important;
            color: #999 !important;
            border: 2px solid rgba(255, 255, 255, 0.2) !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
        }

        /* Remove hover effects for checkout button */
        .btn-checkout:hover,
        .btn-checkout:focus,
        .btn-checkout:active,
        .btn-checkout:focus-visible,
        .btn-checkout:active:focus {
            background-color: rgba(255, 255, 255, 0.9) !important;
            color: #333 !important;
            border: 2px solid rgba(255, 255, 255, 0.5) !important;
            box-shadow: none !important;
            transform: none !important;
        }

        /* Кнопка удаления */
        .btn-remove {
            background-color: transparent;
            color: #ff4757;
            border: none;
            font-size: 0.9rem;
            padding: 0;
        }

        /* Remove hover effects for remove button */
        .btn-remove:hover,
        .btn-remove:focus,
        .btn-remove:active,
        .btn-remove:focus-visible,
        .btn-remove:active:focus {
            background-color: transparent !important;
            color: #ff4757 !important;
            border: none !important;
            text-decoration: none !important;
            box-shadow: none !important;
            transform: none !important;
        }

        .empty-state {
            min-height: 400px;
            color: white;
        }

        .empty-state h3 {
            color: white !important;
        }

        .empty-state p {
            color: white !important;
        }

        .empty-state i {
            color: white !important;
        }

        .loading-spinner {
            width: 3rem;
            height: 3rem;
            color: white;
        }

        .payment-methods img {
            height: 24px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .delivery-option {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        /* Прозрачный хедер */
        .product-header {
            background: transparent;
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
        }

        .product-header h1 {
            margin: 0;
            font-weight: 600;
            color: white;
        }

        .breadcrumb a {
            text-decoration: none !important;
        }

        .breadcrumb a:hover {
            text-decoration: none !important;
        }

        /* Стили для хлебных крошек */
        .breadcrumb-item + .breadcrumb-item::before {
            color: rgba(255, 255, 255, 0.7);
            content: "/";
        }

        .breadcrumb-item.active {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-primary {
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            font-weight: 500;
        }

        /* Alert styles */
        .alert {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.2), rgba(255, 107, 107, 0.2));
            border-color: rgba(220, 53, 69, 0.3);
        }

        .btn-outline-primary {
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            background: transparent;
            backdrop-filter: blur(10px);
        }

        /* Form elements */
        .form-select {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
        }

        .form-select option {
            background: #333;
            color: white;
        }

        .text-danger {
            color: #ff4757 !important;
        }
    </style>
</head>
<body>
<!-- Navigation Fragment -->
<div th:replace="~{fragments/navigation :: navigation}"></div>

<!-- Main Content -->
<!-- Shopping Cart Header -->
<header class="product-header">
    <div class="container">
        <!-- Breadcrumb navigation -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/" class="text-white">Home</a></li>
                <li class="breadcrumb-item active text-white-50" aria-current="page">Shopping Cart</li>
            </ol>
        </nav>
        <h1 class="mb-0">My shopping cart</h1>
    </div>
</header>

<div class="container py-4">
    <div class="row">
        <!-- Cart Items -->
        <div class="col-lg-8">
            <div id="cart-items-container">
                <div class="d-flex justify-content-center py-5">
                    <div class="spinner-border loading-spinner" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">
            <div class="summary-card mb-4">
                <h5 class="fw-bold mb-4">ORDER SUMMARY</h5>

                <div class="d-flex justify-content-between mb-2">
                    <span>Sub-total</span>
                    <span id="subtotal">$0.00</span>
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <span>Delivery</span>
                    <span id="delivery-cost">$0.00</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold">TOTAL</span>
                    <span class="fw-bold" id="total">$0.00</span>
                </div>

                <a href="/checkout" class="btn btn-checkout w-100 mb-3" id="checkout-btn">
                    CHECKOUT
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(function () {
        // Price formatting function
        function formatPrice(price) {
            if (!price) return '$0.00';
            return '$' + parseFloat(price).toFixed(2);
        }

        // Date formatting function
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        // Show empty cart state
        function showEmptyCart() {
            $('#cart-items-container').html(`
                <div class="empty-state text-center py-5">
                    <div class="mb-4">
                        <i class="bi bi-cart" style="font-size: 4rem; color: white;"></i>
                    </div>
                    <h3 class="h4 mb-3" style="color: white;">Your shopping cart is empty</h3>
                    <p class="mb-4" style="color: white;">Start adding products to your cart</p>
                    <a class="btn btn-primary btn-lg px-4" href="/">
                        <i class="bi bi-arrow-right me-2"></i>Browse Products
                    </a>
                </div>
            `);
        }

        // Disable checkout button
        function disableCheckoutButton() {
            $('#checkout-btn')
                .addClass('disabled')
                .attr('aria-disabled', 'true')
                .removeAttr('href')
                .css('pointer-events', 'none');
        }

        // Enable checkout button
        function enableCheckoutButton() {
            $('#checkout-btn')
                .removeClass('disabled')
                .attr('aria-disabled', 'false')
                .attr('href', '/checkout')
                .css('pointer-events', 'auto');
        }

        // Load cart items
        function loadCartItems() {
            $.ajax({
                url: '/api/shopping-cart',
                method: 'GET',
                dataType: 'json',
                success: function (response) {
                    if (!response || response.length === 0) {
                        showEmptyCart();
                        return;
                    }

                    let html = '';
                    response.forEach(item => {
                        const currentQuantity = item.quantity;
                        const maxQuantity = item.stockQuantity;

                        // Generate select options
                        let options = '';
                        for (let i = 1; i <= maxQuantity; i++) {
                            options += `<option value="${i}" ${currentQuantity === i ? 'selected' : ''}>${i}</option>`;
                        }

                        html += `
                            <div class="cart-item p-4" data-id="${item.productId}">
                                <div class="row">
                                    <div class="col-md-2">
                                        <div class="product-img-container">
                                            <img src="${'/uploads/'+ item.imageUrl}" alt="${item.productName}" class="product-img">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <h5 class="mb-2">${item.productName}</h5>
                                        <p class="mb-2" style="color: white;">Added: ${formatDate(item.addedDate)}</p>
                                        <button class="btn-remove remove-item-btn" data-id="${item.productId}">
                                            <i class="bi bi-trash me-1"></i> Remove
                                        </button>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        ${maxQuantity === 0 ? 
                                            '<div class="d-flex flex-column justify-content-center align-items-center h-100"><h5 class="mb-2 text-danger">Product Unavailable</h5><small style="color: white;">Out of Stock</small></div>' :
                                            `<h5 class="mb-3 item-price" data-price="${item.price}">${formatPrice(item.price)}</h5>
                                            <div class="d-flex justify-content-end align-items-center">
                                                <select class="form-select quantity-select" style="width: 80px;">
                                                    ${options}
                                                </select>
                                            </div>
                                            <div class="mt-2">
                                                <small style="color: white;">Available: ${maxQuantity}</small>
                                            </div>`
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    $('#cart-items-container').html(html);
                    updateTotals();
                },
                error: function (xhr, status, error) {
                    console.error('Error loading cart:', status, error);
                    $('#cart-items-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <strong>Error loading cart items</strong>. Please try again later.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div class="text-center mt-4">
                            <a href="javascript:location.reload()" class="btn btn-outline-primary">
                                <i class="bi bi-arrow-repeat me-1"></i> Reload Page
                            </a>
                        </div>
                    `);
                    disableCheckoutButton();
                }
            });
        }

        // Update totals with discount and shipping calculation
        function updateTotals() {
            let subtotal = 0;
            const cartItems = $('.cart-item');

            // Calculate subtotal
            cartItems.each(function() {
                const $item = $(this);
                const $quantitySelect = $item.find('.quantity-select');
                const $priceElement = $item.find('.item-price');
                
                const quantity = parseInt($quantitySelect.val()) || 0;
                const price = parseFloat($priceElement.data('price')) || 0;
                const itemTotal = quantity * price;
                subtotal += itemTotal;
            });

            const total = subtotal;

            // Update summary section
            $('#subtotal').text(formatPrice(subtotal));
            $('#total').text(formatPrice(total));

            // Update checkout button state
            if (subtotal > 0) {
                enableCheckoutButton();
            } else {
                disableCheckoutButton();
            }
        }

        // Handler for quantity select change
        $(document).on('change', '.quantity-select', function() {
            const $item = $(this).closest('.cart-item');
            const productId = $item.data('id');
            const newQuantity = parseInt($(this).val());

            $.ajax({
                url: `/api/shopping-cart/${productId}/quantity?quantity=${newQuantity}`,
                method: 'PUT',
                success: function() {
                    updateTotals();
                },
                error: function(xhr) {
                    alert('Error updating quantity. Please try again.');
                    loadCartItems(); // Reload to get correct values
                }
            });
        });

        // Handler for removing items
        $(document).on('click', '.remove-item-btn', function () {
            const productId = $(this).data('id');
            const $button = $(this);
            const $item = $(this).closest('.cart-item');

            $button.prop('disabled', true).html('<i class="bi bi-arrow-repeat"></i> Removing...');

            $.ajax({
                url: `/api/shopping-cart/${productId}`,
                method: 'DELETE',
                success: function() {
                    $item.fadeOut(300, function() {
                        $(this).remove();
                        // Check if cart is empty
                        if ($('.cart-item').length === 0) {
                            showEmptyCart();
                        } else {
                            updateTotals();
                        }
                    });
                },
                error: function(xhr) {
                    $button.prop('disabled', false).html('<i class="bi bi-trash me-1"></i> Remove');
                    if (xhr.status === 404) {
                        alert('Product not found in your cart');
                    } else {
                        alert('Error removing product from cart');
                    }
                }
            });
        });

        // Initialize cart loading
        loadCartItems();
        
        // Initially disable checkout button until cart is loaded
        disableCheckoutButton();
        
        // Update totals after a short delay to check cart state
        setTimeout(function() {
            updateTotals();
        }, 1000);
    });
</script>

<!-- User Account Script -->
<div th:replace="~{fragments/navigation :: user-account-script}"></div>

</body>
</html>
