<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up | ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Signup Styles -->
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="bi bi-cpu"></i> ByteForge
            </div>
            
            <h2>Create Account</h2>
            <p class="subtitle">Join us and start your journey</p>

            <!-- Error/Success Messages -->
            <div th:if="${param.error}" class="alert alert-error">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${param.error}">Registration error occurred.</span>
            </div>
            
            <div th:if="${param.success}" class="alert alert-success">
                <i class="bi bi-check-circle-fill me-2"></i>
                Registration successful! Please check your email to verify your account.
            </div>

            <form id="signupForm">
                <div class="name-fields">
                    <div class="form-field">
                        <input type="text" 
                               class="form-input name-input" 
                               id="firstName" 
                               name="firstName" 
                               placeholder="First Name">
                        <div id="firstName-error" class="error-message">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span id="firstName-error-text"></span>
                        </div>
                    </div>

                    <div class="form-field">
                        <input type="text" 
                               class="form-input name-input" 
                               id="lastName" 
                               name="lastName" 
                               placeholder="Last Name">
                        <div id="lastName-error" class="error-message">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span id="lastName-error-text"></span>
                        </div>
                    </div>
                </div>

                <div class="form-field">
                    <input type="email" 
                           class="form-input email-input" 
                           id="email" 
                           name="email" 
                           placeholder="Enter your email">
                    <div id="email-error" class="error-message">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span id="email-error-text">This email is already registered</span>
                    </div>
                </div>

                <div class="password-container">
                <div class="form-field">
                    <div class="password-field-wrapper">
                        <input type="password" 
                                   class="form-input password-input" 
                               id="password" 
                               name="password" 
                               placeholder="Create a password">
                    </div>
                        <div id="password-error" class="error-message">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span id="password-error-text"></span>
                        </div>
                </div>

                <div class="form-field">
                    <div class="password-field-wrapper">
                        <input type="password" 
                                   class="form-input password-input" 
                               id="confirmPassword" 
                               name="confirmPassword" 
                               placeholder="Confirm password">
                    </div>
                        <div id="confirmPassword-error" class="error-message">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span id="confirmPassword-error-text"></span>
                        </div>
                    </div>
                </div>

                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms">
                        I agree to the <a href="/terms" target="_blank">Terms of Service</a> and 
                        <a href="/privacy" target="_blank">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-person-plus me-2"></i>
                    Create Account
                </button>
            </form>

            <div class="auth-links">
                <span>Already have an account? </span>
                <a href="/auth/login">Sign in</a>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Signup Script -->
    <script th:src="@{/js/signup.js}"></script>
</body>
</html>
