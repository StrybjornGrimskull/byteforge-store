<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="page-title">Product Details | ByteForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Product Details Styles -->
    <link rel="stylesheet" th:href="@{/css/product-details.css}">
</head>
<body>
<!-- Navigation Fragment -->
<div th:replace="~{fragments/navigation :: navigation}"></div>

<!-- Product Header -->
<header class="product-header">
    <div class="container">
        <!-- Breadcrumb navigation -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0" id="breadcrumb-nav">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white">Categories</a></li>
                <li class="breadcrumb-item">
                    <a href="#" class="text-white" id="breadcrumb-category">Category</a>
                </li>
                <li class="breadcrumb-item active text-white-50" aria-current="page" id="breadcrumb-product">Product</li>
            </ol>
        </nav>
        <div class="mt-3">
            <h1 class="mb-0 d-flex align-items-center" id="product-header">
                <img src="" alt="" class="brand-logo me-3" id="brand-logo">
                <span id="product-name-header">Loading...</span>
            </h1>
        </div>
    </div>
</header>

<div class="container py-4">
    <!-- Main product information -->
    <div class="row mb-5">
        <div class="col-lg-6 mb-4 d-flex align-items-center justify-content-center position-relative product-image-container">
            <img src="" alt="" class="product-image img-fluid" id="product-main-image">
            <!-- Скидка в правом нижнем углу -->
            <div id="discount-badge" class="position-absolute d-flex align-items-center" style="right: 16px; bottom: 16px; z-index: 3; display: none !important;">
                <div class="d-flex flex-column align-items-center">
                    <span class="text-danger fw-bold" style="font-size: 2.25rem;" id="discount-percentage"></span>
                    <span class="text-danger fw-bold" style="font-size: 1.2rem;">DISCOUNT</span>
                </div>
                <img th:src="@{'/uploads/icons/gui-discount.svg'}" width="90" height="90" alt="Discount">
            </div>
            <button id="wishlistBtn"
                    data-product-id=""
                    class="position-absolute"
                    style="right: 16px; top: 16px; z-index: 2; background: none; border: none; padding: 0; cursor: pointer;">
                <i class="bi bi-heart wishlist-heart" style="font-size: 1.7rem;"></i>
            </button>
        </div>
        <div class="col-lg-6">

            <div class="d-flex align-items-center mb-4">
                <!-- Цена с учетом скидки -->
                <div class="price-section me-3" id="price-section">
                    <!-- Prices will be loaded dynamically -->
                </div>
            </div>

            <p class="lead mb-4 product-description" id="product-description">Loading...</p>
            
            <div class="mb-3">
                <span class="stock-status fw-bold" id="stock-status">
                </span>
            </div>
            
            <div class="mb-3" id="rating-section">
                <span class="text-white">Loading ratings...</span>
            </div>

            <div class="d-flex gap-3 mb-5">
                <button id="cartBtn"
                        data-product-id=""
                        data-stock-quantity="0"
                        class="btn btn-cart btn-lg px-4"
                        disabled>
                    Add to Cart
                </button>
                <div sec:authorize="hasAnyRole('ADMIN','PRODUCT_MANAGER')">
                    <button id="editProductBtn"
                            type="button"
                            class="btn btn-warning btn-lg px-4"
                            data-bs-toggle="modal"
                            data-bs-target="#editProductModal">
                        Edit
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Product specifications - современные карточки -->
    <div class="specs-header">
        <h3 class="specs-title">
            <i class="bi bi-list-check"></i>Specifications
        </h3>
        
        <!-- Основная информация о продукте -->
        <div class="specs-grid" id="basic-specs-grid">
            <!-- Basic specs will be loaded dynamically -->
        </div>
        
        <!-- Выпадающая секция для технических характеристик -->
        <div class="mt-4">
            <button type="button" class="btn btn-link tech-specs-button p-0 border-0 bg-transparent text-start w-100 d-flex align-items-center justify-content-between" onclick="toggleTechSpecs()" aria-expanded="false" aria-controls="techSpecsContent">
                <span class="fw-semibold">TECHNICAL SPECIFICATIONS</span>
                <i class="bi bi-chevron-down" id="techSpecsIcon"></i>
            </button>
        </div>
        
        <div id="techSpecsContent" style="display: none;">
            <div class="specs-grid" id="techSpecsGrid">
                <!-- Динамические технические характеристики будут добавлены здесь -->
            </div>
        </div>
    </div>
</div>
<!-- Footer Fragment -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<!-- Edit Product Modal -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editProductModalLabel">Edit product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editProductForm">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label" for="editImage">Product image (WebP)</label>
              <input type="file" accept="image/webp" class="form-control" id="editImage">
              <div class="form-text">Загрузите .webp — файл будет сохранён в /uploads</div>
              <div class="mt-2">
                <img id="editImagePreview" src="" alt="Preview" style="max-width: 220px; max-height: 160px; display:none; border-radius:6px;"/>
              </div>
            </div>
            <div class="col-md-8">
              <label class="form-label" for="editName">Name</label>
              <input type="text" class="form-control" id="editName">
              <div class="invalid-feedback" id="err-editName"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="editPrice">Price (€)</label>
              <input type="number" step="0.01" class="form-control" id="editPrice" disabled>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="editOriginalPrice">Original price (€)</label>
              <input type="number" step="0.01" class="form-control" id="editOriginalPrice">
              <div class="invalid-feedback" id="err-editOriginalPrice"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="editDiscountPercentage">Discount (%)</label>
              <input type="number" step="1" min="0" max="100" class="form-control" id="editDiscountPercentage">
              <div class="invalid-feedback" id="err-editDiscountPercentage"></div>
            </div>
            <div class="col-md-12">
              <label class="form-label" for="editShortDescription">Short description</label>
              <textarea class="form-control" id="editShortDescription" rows="3"></textarea>
              <div class="invalid-feedback" id="err-editShortDescription"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="editStockQuantity">Stock quantity</label>
              <input type="number" class="form-control" id="editStockQuantity">
              <div class="invalid-feedback" id="err-editStockQuantity"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="editCategoryId">Category</label>
              <select id="editCategoryId" class="form-select"></select>
              <div class="invalid-feedback" id="err-editCategoryId"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="editBrandId">Brand</label>
              <select id="editBrandId" class="form-select"></select>
              <div class="invalid-feedback" id="err-editBrandId"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="editReleaseYear">Release year</label>
              <input type="number" min="1990" max="2030" class="form-control" id="editReleaseYear">
              <div class="invalid-feedback" id="err-editReleaseYear"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="editWarrantyMonths">Warranty (months)</label>
              <input type="number" min="1" max="120" class="form-control" id="editWarrantyMonths">
              <div class="invalid-feedback" id="err-editWarrantyMonths"></div>
            </div>
          </div>

          <hr class="my-4"/>
          <h6 class="mb-2">Specifications</h6>
          <div id="editSpecsContainer" class="row g-3"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <!-- Save can be wired later -->
        <button type="button" class="btn btn-primary" id="saveEditBtn">Save</button>
      </div>
    </div>
  </div>
  </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- User Account Script -->
<div th:replace="~{fragments/navigation :: user-account-script}"></div>

<!-- Custom Product Details Script -->
<script th:src="@{/js/product-details.js}"></script>
