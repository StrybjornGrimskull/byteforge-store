<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAM Specifications Fragment</title>
</head>
<body>

<!-- RAM Specifications Fragment -->
<div th:fragment="ram-specs" class="ram-specs-section">
    <h5 class="fw-semibold mb-3 text-secondary">RAM Specifications</h5>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="ramMemorySize" class="form-label fw-semibold">Memory Size (GB) *</label>
                <input type="number" class="form-control" id="ramMemorySize" name="memorySize" 
                       placeholder="16" min="1" required>
                <div class="invalid-feedback">
                    Please provide memory size.
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="form-group">
                <label for="ramModulesCount" class="form-label fw-semibold">Modules Count *</label>
                <input type="number" class="form-control" id="ramModulesCount" name="modulesCount" 
                       placeholder="2" min="1" required>
                <div class="invalid-feedback">
                    Please provide number of modules.
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="ramSpeed" class="form-label fw-semibold">Speed (MHz) *</label>
                <input type="number" class="form-control" id="ramSpeed" name="speed" 
                       placeholder="3200" min="1" required>
                <div class="invalid-feedback">
                    Please provide memory speed.
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="form-group">
                <label for="ramType" class="form-label fw-semibold">Type *</label>
                <select class="form-select" id="ramType" name="type" required>
                    <option value="">Select RAM type</option>
                    <option value="DDR4">DDR4</option>
                    <option value="DDR5">DDR5</option>
                    <option value="DDR3">DDR3</option>
                </select>
                <div class="invalid-feedback">
                    Please select RAM type.
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="ramTimings" class="form-label fw-semibold">Timings *</label>
                <input type="text" class="form-control" id="ramTimings" name="timings" 
                       placeholder="CL16-18-18-36" required>
                <div class="invalid-feedback">
                    Please provide memory timings.
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="form-group">
                <label for="ramVoltage" class="form-label fw-semibold">Voltage (V) *</label>
                <input type="number" class="form-control" id="ramVoltage" name="voltage" 
                       placeholder="1.35" step="0.01" min="0" required>
                <div class="invalid-feedback">
                    Please provide voltage.
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
