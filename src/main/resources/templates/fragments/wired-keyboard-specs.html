<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wired Keyboard Specifications Fragment</title>
</head>
<body>

<!-- Wired Keyboard Specifications Fragment -->
<div th:fragment="wired-keyboard-specs" class="wired-keyboard-specs-section">
    <h5 class="fw-semibold mb-3 text-secondary">Wired Keyboard Specifications</h5>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardLayout" class="form-label fw-semibold">Layout *</label>
                <select class="form-select" id="wiredKeyboardLayout" name="wiredKeyboardLayout" required>
                    <option value="">Select layout</option>
                    <option value="Full-size">Full-size</option>
                    <option value="TKL">TKL (Tenkeyless)</option>
                    <option value="75%">75%</option>
                    <option value="65%">65%</option>
                    <option value="60%">60%</option>
                    <option value="40%">40%</option>
                </select>
                <div class="invalid-feedback">
                    Please select a layout.
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardSwitchType" class="form-label fw-semibold">Switch Type *</label>
                <select class="form-select" id="wiredKeyboardSwitchType" name="wiredKeyboardSwitchType" required>
                    <option value="">Select switch type</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Membrane">Membrane</option>
                    <option value="Hybrid">Hybrid</option>
                </select>
                <div class="invalid-feedback">
                    Please select switch type.
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardSwitchBrand" class="form-label fw-semibold">Switch Brand *</label>
                <input type="text" class="form-control" id="wiredKeyboardSwitchBrand" name="wiredKeyboardSwitchBrand" 
                       placeholder="Cherry, Gateron" required>
                <div class="invalid-feedback">
                    Please provide switch brand.
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardSwitchModel" class="form-label fw-semibold">Switch Model *</label>
                <input type="text" class="form-control" id="wiredKeyboardSwitchModel" name="wiredKeyboardSwitchModel" 
                       placeholder="MX Red, Blue" required>
                <div class="invalid-feedback">
                    Please provide switch model.
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardActuationForce" class="form-label fw-semibold">Actuation Force (g) *</label>
                <input type="number" class="form-control" id="wiredKeyboardActuationForce" name="wiredKeyboardActuationForce" 
                       placeholder="45" step="0.1" min="0" required>
                <div class="invalid-feedback">
                    Please provide actuation force.
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardTravelDistance" class="form-label fw-semibold">Travel Distance (mm) *</label>
                <input type="number" class="form-control" id="wiredKeyboardTravelDistance" name="wiredKeyboardTravelDistance" 
                       placeholder="2.0" step="0.1" min="0" required>
                <div class="invalid-feedback">
                    Please provide travel distance.
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardWeight" class="form-label fw-semibold">Weight (g) *</label>
                <input type="number" class="form-control" id="wiredKeyboardWeight" name="wiredKeyboardWeight" 
                       placeholder="1200" min="0" required>
                <div class="invalid-feedback">
                    Please provide weight.
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="form-group">
                <label for="wiredKeyboardCableLength" class="form-label fw-semibold">Cable Length (m) *</label>
                <input type="number" class="form-control" id="wiredKeyboardCableLength" name="wiredKeyboardCableLength" 
                       placeholder="1.8" step="0.1" min="0" required>
                <div class="invalid-feedback">
                    Please provide cable length.
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-4">
            <div class="form-group">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" id="wiredKeyboardRgbLighting" name="wiredKeyboardRgbLighting">
                    <label class="form-check-label" for="wiredKeyboardRgbLighting">
                        RGB Lighting
                    </label>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="form-group">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" id="wiredKeyboardHotSwappable" name="wiredKeyboardHotSwappable">
                    <label class="form-check-label" for="wiredKeyboardHotSwappable">
                        Hot Swappable
                    </label>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="form-group">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" id="wiredKeyboardUsbPassthrough" name="wiredKeyboardUsbPassthrough">
                    <label class="form-check-label" for="wiredKeyboardUsbPassthrough">
                        USB Passthrough
                    </label>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" id="wiredKeyboardDetachableCable" name="wiredKeyboardDetachableCable">
                    <label class="form-check-label" for="wiredKeyboardDetachableCable">
                        Detachable Cable
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
