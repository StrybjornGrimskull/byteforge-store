<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password | ByteForge</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Forgot Password Styles -->
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="bi bi-cpu"></i> ByteForge
            </div>
            
            <h2>Forgot Password</h2>
            <p class="subtitle">Enter your email address and we will send you a link to reset your password</p>

            <div id="message-container" style="display: none;"></div>

            <form id="forgotPasswordForm">
                <div class="form-field">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" 
                           class="form-input" 
                           id="email" 
                           name="email" 
                           placeholder="Enter your email address" 
                           required 
                           autofocus>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-send me-2"></i>
                    Send Reset Link
                </button>
            </form>

            <div class="auth-links">
                <a th:href="@{/auth/login}">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Forgot Password Script -->
    <script th:src="@{/js/forgot-password.js}"></script>
</body>
</html>
