<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Login Styles -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="bi bi-cpu"></i> ByteForge
            </div>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your account to continue</p>

            <!-- Error/Success Messages -->
            <div th:if="${loginError}" class="alert" 
                 th:classappend="${errorType == 'disabled'} ? 'alert-warning' : 'alert-danger'">
                <i th:class="${errorType == 'disabled'} ? 'bi bi-envelope-exclamation-fill me-2' : 'bi bi-exclamation-triangle-fill me-2'"></i>
                <span th:text="${loginError}">Error message</span>
                <div th:if="${errorType == 'disabled'}" class="mt-2">
                    <a href="/auth/verify-email" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-envelope me-1"></i>
                        Resend verification email
                    </a>
                </div>
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="bi bi-check-circle-fill me-2"></i>
                You have been successfully logged out.
            </div>

            <form id="loginForm">
                <div class="form-field">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" 
                           class="form-input" 
                           id="email" 
                           name="email" 
                           placeholder="Enter your email" 
                           required>
                </div>

                <div class="form-field">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" 
                           class="form-input" 
                           id="password" 
                           name="password" 
                           placeholder="Enter your password" 
                           required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-arrow-right me-2"></i>
                    Sign In
                </button>
            </form>

            <div class="auth-links">
                <a href="/auth/forgot-password">Forgot your password?</a>
                <br>
                <span>Don't have an account? </span>
                <a href="/auth/signup">Sign up</a>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Login Script -->
    <script th:src="@{/js/login.js}"></script>
</body>
</html>
