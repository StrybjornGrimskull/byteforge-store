<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archived Orders - ByteForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom Admin Archived Orders Styles -->
    <link rel="stylesheet" th:href="@{/css/admin-archived-orders.css}">
</head>
<body class="bg-light">

<div th:replace="fragments/navigation :: navigation"></div>

<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard/orders}">Orders Management</a></li>
            <li class="breadcrumb-item active" aria-current="page">Archived Orders</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Archived Orders</h1>
        <div>
            <a href="/admin/dashboard/orders/active" class="btn btn-outline-primary me-2">
                <i class="bi bi-arrow-left me-1"></i> Active Orders
            </a>
            <span class="badge bg-secondary">
                <span id="ordersCount">0</span> Archived Orders
            </span>
        </div>
    </div>

    <div class="search-container">
        <div class="input-group">
            <input type="text" class="form-control" id="orderSearchInput" placeholder="Search by order number">
            <button class="btn btn-primary" type="button" id="searchOrderBtn">
                <i class="bi bi-search"></i>
            </button>
            <button class="btn btn-outline-secondary" type="button" id="showAllOrdersBtn">
                <i class="bi bi-list-ul"></i>
            </button>
        </div>
    </div>

    <div id="ordersContainer">
        <div class="text-center py-4">
            <p class="mt-2 mb-0">Loading orders...</p>
        </div>
    </div>
    <div class="text-center mt-4" id="loadMoreContainer" style="display: none;">
        <button class="btn load-more-btn" id="loadMoreBtn">
            <i class="bi bi-arrow-down-circle me-2"></i>Load More Orders
        </button>
    </div>
</div>

<th:block th:replace="fragments/footer :: footer"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom Admin Archived Orders Script -->
<script th:src="@{/js/admin-archived-orders.js}"></script>
<!-- User Account Script -->
<div th:replace="fragments/navigation :: user-account-script"></div>
</body>
</html>
