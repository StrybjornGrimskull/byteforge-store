<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password | ByteForge</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Reset Password Styles -->
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="bi bi-cpu"></i> ByteForge
            </div>
            
            <h2>Reset Your Password</h2>
            <p class="subtitle">Enter your new password below</p>

            <div id="message-container" style="display: none;"></div>

            <form id="resetPasswordForm">
                
                <div class="form-field">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" 
                           class="form-input" 
                           id="password" 
                           name="password" 
                           placeholder="Enter new password" 
                           required>
                </div>
                
                <div class="form-field">
                    <i class="bi bi-lock-fill input-icon"></i>
                    <input type="password" 
                           class="form-input" 
                           id="confirmPassword" 
                           name="confirmPassword" 
                           placeholder="Confirm new password" 
                           required>
                </div>
                
                <div id="password-message" class="password-message"></div>
                
                <button type="submit" id="submit-btn" class="btn-submit">
                    <i class="bi bi-check-circle me-2"></i>
                    Reset Password
                </button>
            </form>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Custom Reset Password Script -->
    <script th:src="@{/js/reset-password.js}"></script>
</body>
</html>
