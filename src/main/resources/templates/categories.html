<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" xml:lang="ru">
<head>
    <title>Categories | ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;600&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/categories.css}">

</head>
<body>

<!-- Navigation Fragment -->
<div th:replace="~{fragments/navigation :: navigation}"></div>
<!--Сообщение о выходе из системы-->
<div th:if="${logoutMessage}" class="alert alert-success  text-center">
    <i class="fas fa-check-circle"></i>
    <span th:text="${logoutMessage}"></span>
</div>

<div class="container mt-4">
    <h1 class="mb-4">Categories</h1>
    <div class="categories-row">
        <!-- Graphics Cards -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/grafic cards.png" alt="Graphics Cards" class="card-image">
                <div class="card-content">
                    <h5 class="card-title">Graphics<br>Cards</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=1" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Processors -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/processors.png" alt="Processors" class="card-image">
                <div class="card-content">
                    <h5 class="card-title">Processors</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=2" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Motherboards -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/motherboards.png" alt="Motherboards" class="card-image">
                <div class="card-content">
                    <h5 class="card-title">Motherboards</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=3" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- RAM -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/ram.png" alt="RAM" class="card-image">
                <div class="card-content">
                    <h5 class="card-title ram-title">Random <br>memory access</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=4" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Storage -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/ssd.png" alt="Solid State Drive" class="card-image">
                <div class="card-content">
                    <h5 class="card-title">Solid state<br>drive</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=8" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Power Supplies -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/psu.png" alt="Power Supply Unit" class="card-image">
                <div class="card-content">
                    <h5 class="card-title">Power supply<br>unit</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=5" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- PC Cases -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/cases.png" alt="PC Cases" class="card-image">
                <div class="card-content">
                    <h5 class="card-title">PC Cases</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=6" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Monitors -->
        <div class="category-col">
            <div class="card">
                <img src="/uploads/icons/monitors.png" alt="Monitors" class="card-image">
                <div class="card-content">
                    <h5 class="card-title">Monitors</h5>
                </div>
                <div class="card-body">
                    <a href="/products/list?categoryId=7" class="shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Keyboards -->
        <div class="category-col">
            <div class="card" id="keyboard-card">
                <img src="/uploads/icons/keyboards.png" alt="Keyboards" class="card-image keyboard-image">
                <div class="card-content">
                    <h5 class="card-title">Keyboards</h5>
                </div>
                <div class="card-body">
                    <a href="#" class="shop-now" id="keyboard-shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
                <!-- Split view for keyboard types -->
                <div class="keyboard-split" id="keyboard-split">
                    <div class="back-arrow" id="keyboard-back-arrow">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                    </div>
                    <button class="keyboard-split-left" onclick="window.location.href='/products/list?categoryId=9'" aria-label="Перейти к проводным клавиатурам">
                        <div style="text-align: center;">
                            <img src="/uploads/icons/usb-svgrepo-com.svg" alt="USB" class="keyboard-icon">
                            <div class="keyboard-split-text">USB</div>
                        </div>
                    </button>
                    <button class="keyboard-split-right" onclick="window.location.href='/products/list?categoryId=10'" aria-label="Перейти к беспроводным клавиатурам">
                        <div style="text-align: center;">
                            <svg class="keyboard-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
                            </svg>
                            <div class="keyboard-split-text">Bluetooth</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mice -->
        <div class="category-col">
            <div class="card" id="mice-card">
                <img src="/uploads/icons/mice.png" alt="Mice" class="card-image mice-image">
                <div class="card-content">
                    <h5 class="card-title">Mice</h5>
                </div>
                    <div class="card-body">
                    <a href="#" class="shop-now" id="mice-shop-now">
                        Shop Now
                        <div class="arrow"></div>
                    </a>
                </div>
                <!-- Split view for mice types -->
                <div class="mice-split" id="mice-split">
                    <div class="back-arrow" id="mice-back-arrow">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                    </div>
                    <button class="mice-split-left" onclick="window.location.href='/products/list?categoryId=11'" aria-label="Перейти к проводным мышкам">
                        <div style="text-align: center;">
                            <img src="/uploads/icons/usb-svgrepo-com.svg" alt="USB" class="mice-icon">
                            <div class="mice-split-text">Wired</div>
                        </div>
                    </button>
                    <button class="mice-split-right" onclick="window.location.href='/products/list?categoryId=12'" aria-label="Перейти к беспроводным мышкам">
                        <div style="text-align: center;">
                            <svg class="mice-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
                            </svg>
                            <div class="mice-split-text">Wireless</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Footer Fragment -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- User Account Script -->
<div th:replace="~{fragments/navigation :: user-account-script}"></div>

<!-- Custom JavaScript -->
<script th:src="@{/js/categories.js}"></script>

</body>
</html>
