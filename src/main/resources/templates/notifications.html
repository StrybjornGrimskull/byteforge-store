<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xml:lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - ByteForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Фоновое изображение для страницы */
        body {
            background-image: url('/uploads/icons/opoy7.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Ubuntu', sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            transition: all 0.3s ease;
            color: white;
        }

        .new-badge {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
            margin-right: 12px;
            flex-shrink: 0;
            align-self: flex-start;
        }

        .notification-item.unread .card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(147, 197, 253, 0.2));
            border: 2px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2), 0 0 0 1px rgba(59, 130, 246, 0.1);
            position: relative;
            overflow: hidden;
        }

        .notification-item.unread .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }



        /* Улучшенная читаемость текста */
        .card-body p {
            color: rgba(255, 255, 255, 0.95) !important;
            font-weight: 500;
            line-height: 1.5;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .card-body small {
            color: rgba(255, 255, 255, 0.8) !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .btn {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }


        /* Заголовок в стиле product-details */
        .notifications-header {
            background: transparent;
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
        }

        .breadcrumb a {
            text-decoration: none;
        }
        
        /* Стили для хлебных крошек */
        .breadcrumb-item + .breadcrumb-item::before {
            color: rgba(255, 255, 255, 0.7);
            content: "/";
        }
        
        .breadcrumb-item.active {
            color: rgba(255, 255, 255, 0.5);
        }


    </style>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="min-vh-100">
    <!-- Notifications Header -->
    <header class="notifications-header">
        <div class="container">
            <!-- Breadcrumb navigation -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-white">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/profile}" class="text-white">Profile</a></li>
                    <li class="breadcrumb-item active text-white-50" aria-current="page">Notifications</li>
                </ol>
            </nav>
            <div class="mt-3 d-flex align-items-center justify-content-between">
                <div>
                    <h1 class="page-title mb-0">Notifications</h1>
                    <p class="page-subtitle mt-2">Stay updated with your account activity</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-warning text-dark fs-6" id="unread-count">0 unread</span>
                    <button class="btn btn-outline-light btn-sm" id="mark-all-read-btn" onclick="markAllAsRead()">
                        <i class="bi bi-check-all me-1"></i>Mark all as read
                    </button>
                    <button class="btn btn-outline-danger btn-sm" id="delete-all-btn" onclick="deleteAllNotifications()">
                        <i class="bi bi-trash me-1"></i>Delete all
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Loading State -->
                <div id="loading-state" class="text-center py-5">
                    <progress class="progress" style="width: 3rem; height: 3rem;" aria-label="Loading notifications">
                        <span class="visually-hidden">Loading notifications...</span>
                    </progress>
                    <p class="mt-3" style="color: rgba(255, 255, 255, 0.6);">Loading your notifications...</p>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="text-center py-5 d-none">
                    <i class="bi bi-bell-slash display-1" style="color: rgba(255, 255, 255, 0.6);"></i>
                    <h4 class="mt-3" style="color: rgba(255, 255, 255, 0.8);">No notifications yet</h4>
                    <p style="color: rgba(255, 255, 255, 0.6);">You'll see notifications about your reviews and account activity here.</p>
                </div>

                <!-- Notifications List -->
                <div id="notifications-container" class="d-none">
                    <!-- Notifications will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let currentUserId = null;

    // Helper functions to extract nested ternary operations

    function handleDeleteAllResponse(allSuccessful) {
        if (allSuccessful) {
            // Reload notifications
            loadNotifications();
        } else {
            alert('Some notifications could not be deleted');
        }
    }

    // Get current user ID from the page or API
    fetch('/api/profile')
        .then(response => {
            console.log('Profile response status:', response.status);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return response.json();
        })
        .then(profile => {
            console.log('Profile data:', profile);
            currentUserId = profile.userId;
            console.log('Current user ID:', currentUserId);
            loadNotifications();
        })
        .catch(error => {
            console.error('Error getting user profile:', error);
            document.getElementById('loading-state').innerHTML = 
                `<div class="alert alert-danger">Failed to load user profile: ${error.message}</div>`;
        });

    function loadNotifications() {
        if (!currentUserId) return;

        fetch(`/api/notifications/user/${currentUserId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(notifications => {
                console.log('Notifications loaded:', notifications);
                displayNotifications(notifications);
                updateUnreadCount(notifications);
            })
            .catch(error => {
                console.error('Error loading notifications:', error);
                document.getElementById('loading-state').innerHTML = 
                    `<div class="alert alert-danger">Failed to load notifications: ${error.message}</div>`;
            });
    }

    function displayNotifications(notifications) {
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');
        const container = document.getElementById('notifications-container');

        loadingState.classList.add('d-none');

        if (!notifications || notifications.length === 0) {
            emptyState.classList.remove('d-none');
            container.classList.add('d-none');
            return;
        }

        emptyState.classList.add('d-none');
        container.classList.remove('d-none');

        container.innerHTML = notifications.map(notification => {
            const itemClass = notification.isRead ? 'notification-item' : 'notification-item unread';
            
            return `
                <div class="card mb-3 ${itemClass}"
                     data-notification-id="${notification.id}">
                    <div class="card-body">
                        <div class="d-flex align-items-start">
                            ${!notification.isRead ? '<div class="new-badge">NEW</div>' : ''}
                            <div class="flex-grow-1">
                                <p class="mb-2">${notification.message}</p>
                                <small style="color: rgba(255, 255, 255, 0.7);">
                                    <i class="bi bi-clock me-1"></i>
                                    ${formatDate(notification.createdAt)}
                                </small>
                            </div>
                            <div class="d-flex flex-column gap-2">
                                ${!notification.isRead ? `
                                    <span class="text-white" style="cursor: pointer;" onclick="markAsRead(${notification.id})">
                                        Read
                                    </span>
                                ` : ''}
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteNotification(${notification.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateUnreadCount(notifications) {
        const unreadCount = notifications.filter(n => !n.isRead).length;
        const countElement = document.getElementById('unread-count');
        if (countElement) {
            countElement.textContent = `${unreadCount} unread`;
        }
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('ru-RU', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    window.markAsRead = function(notificationId) {
        fetch(`/api/notifications/${notificationId}/read`, {
            method: 'PUT'
        })
        .then(response => {
            if (response.ok) {
                // Update UI
                const notificationElement = document.querySelector(`[data-notification-id="${notificationId}"]`);
                if (notificationElement) {
                    notificationElement.classList.remove('unread');
                    notificationElement.classList.add('notification-item');
                    // Remove mark as read button
                    const markAsReadBtn = notificationElement.querySelector('button[onclick*="markAsRead"]');
                    if (markAsReadBtn) {
                        markAsReadBtn.remove();
                    }
                }
                // Reload notifications to update count
                loadNotifications();
            }
        })
        .catch(error => {
            console.error('Error marking notification as read:', error);
            alert('Failed to mark notification as read');
        });
    };

    window.markAllAsRead = function() {
        if (!currentUserId) return;
        
        fetch(`/api/notifications/user/${currentUserId}/read-all`, {
            method: 'PUT'
        })
        .then(response => {
            if (response.ok) {
                // Reload notifications
                loadNotifications();
            }
        })
        .catch(error => {
            console.error('Error marking all notifications as read:', error);
            alert('Failed to mark all notifications as read');
        });
    };

    window.deleteNotification = function(notificationId) {
        if (!confirm('Are you sure you want to delete this notification?')) {
            return;
        }
        
        fetch(`/api/notifications/${notificationId}`, {
            method: 'DELETE'
        })
        .then(response => {
            if (response.ok) {
                // Remove the notification from UI
                const notificationElement = document.querySelector(`[data-notification-id="${notificationId}"]`);
                if (notificationElement) {
                    notificationElement.remove();
                }
                // Reload notifications to update count
                loadNotifications();
            }
        })
        .catch(error => {
            console.error('Error deleting notification:', error);
            alert('Failed to delete notification');
        });
    };

    function processDeleteAllNotifications(notifications) {
        if (!notifications || notifications.length === 0) {
            alert('No notifications to delete');
            return;
        }
        
        // Delete each notification
        const deletePromises = notifications.map(notification => 
            fetch(`/api/notifications/${notification.id}`, {
                method: 'DELETE'
            })
        );
        
        Promise.all(deletePromises)
            .then(responses => {
                const allSuccessful = responses.every(response => response.ok);
                handleDeleteAllResponse(allSuccessful);
            })
            .catch(error => {
                console.error('Error deleting notifications:', error);
                alert('Failed to delete notifications');
            });
    }

    window.deleteAllNotifications = function() {
        if (!currentUserId) return;
        
        if (!confirm('Are you sure you want to delete ALL notifications? This action cannot be undone.')) {
            return;
        }
        
        // Get all notification IDs first
        fetch(`/api/notifications/user/${currentUserId}`)
            .then(response => response.json())
            .then(processDeleteAllNotifications)
            .catch(error => {
                console.error('Error loading notifications for deletion:', error);
                alert('Failed to load notifications');
            });
    };
});
</script>

<!-- Navigation Script -->
<div th:replace="~{fragments/navigation :: user-account-script}"></div>

</body>
</html>
