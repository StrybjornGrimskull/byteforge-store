<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xml:lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - ByteForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Custom Notifications Styles -->
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="min-vh-100">
    <!-- Notifications Header -->
    <header class="notifications-header">
        <div class="container">
            <!-- Breadcrumb navigation -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-white">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/profile}" class="text-white">Profile</a></li>
                    <li class="breadcrumb-item active text-white-50" aria-current="page">Notifications</li>
                </ol>
            </nav>
            <div class="mt-3 d-flex align-items-center justify-content-between">
                <div>
                    <h1 class="page-title mb-0">Notifications</h1>
                    <p class="page-subtitle mt-2">Stay updated with your account activity</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-warning text-dark fs-6" id="unread-count">0 unread</span>
                    <button class="btn btn-outline-light btn-sm" id="mark-all-read-btn" onclick="markAllAsRead()">
                        <i class="bi bi-check-all me-1"></i>Mark all as read
                    </button>
                    <button class="btn btn-outline-danger btn-sm" id="delete-all-btn" onclick="deleteAllNotifications()">
                        <i class="bi bi-trash me-1"></i>Delete all
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Loading State -->
                <div id="loading-state" class="text-center py-5">
                    <progress class="progress" style="width: 3rem; height: 3rem;" aria-label="Loading notifications">
                        <span class="visually-hidden">Loading notifications...</span>
                    </progress>
                    <p class="mt-3" style="color: rgba(255, 255, 255, 0.6);">Loading your notifications...</p>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="text-center py-5 d-none">
                    <i class="bi bi-bell-slash display-1" style="color: rgba(255, 255, 255, 0.6);"></i>
                    <h4 class="mt-3" style="color: rgba(255, 255, 255, 0.8);">No notifications yet</h4>
                    <p style="color: rgba(255, 255, 255, 0.6);">You'll see notifications about your reviews and account activity here.</p>
                </div>

                <!-- Notifications List -->
                <div id="notifications-container" class="d-none">
                    <!-- Notifications will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Notifications Script -->
    <script th:src="@{/js/notifications.js}"></script>

<!-- Navigation Script -->
<div th:replace="~{fragments/navigation :: user-account-script}"></div>

</body>
</html>
