<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Wishlist | ByteForge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Wishlist Styles -->
    <link rel="stylesheet" th:href="@{/css/wishlist.css}">
</head>
<body>
<!-- Navigation Fragment -->
<div th:replace="~{fragments/navigation :: navigation}"></div>

<!-- Main Content -->
<!-- Wishlist Header -->
<header class="product-header">
    <div class="container">
        <!-- Breadcrumb navigation -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/" class="text-white">Home</a></li>
                <li class="breadcrumb-item active text-white-50" aria-current="page">Wishlist</li>
            </ol>
        </nav>
        <h1 class="mb-0">My wishlist</h1>
    </div>
</header>

<div class="container py-4">
    <!-- Wishlist Content -->
    <div id="wishlist-container">
        <div class="d-flex justify-content-center py-5">
            <div class="spinner-border loading-spinner" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom Wishlist Script -->
<script th:src="@{/js/wishlist.js}"></script>

<!-- User Account Script -->
<div th:replace="~{fragments/navigation :: user-account-script}"></div>

</body>
</html>
